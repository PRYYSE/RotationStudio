name: Publish Rotation Studio
on:
  push:
    branches: [main]
    paths:
      - 'visualizer/**'
      - '.github/workflows/publish-rotation-studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - name: Install the original visualizer dependencies
        working-directory: visualizer
        run: npm ci
      - name: Validate rotation plans and playback logic
        working-directory: visualizer
        run: npm test
      - name: Build for GitHub Pages
        working-directory: visualizer
        run: npm run build -- --base=/RotationStudio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: visualizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

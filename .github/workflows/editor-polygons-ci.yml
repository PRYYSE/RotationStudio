name: Temporary coverage editor validation
on:
  push:
    branches:
      - feature/independent-coverage-polygons-20261110
  pull_request:
    branches:
      - main
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
